<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Europa-Daten · Kennzeichen-Sofortfinder</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:16px system-ui,sans-serif}.wrap{max-width:800px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head a{color:#1d4ed8}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px #0001;margin-top:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select,.controls input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:10px}.warning{background:#fff7ed;color:#9a3412;border-radius:10px;padding:10px;margin-top:12px}.consent{display:flex;gap:8px;margin-top:10px;align-items:flex-start}.results{display:grid;gap:8px;margin-top:12px}.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#f8fafc;color:inherit;text-decoration:none}.code{min-width:44px;font-weight:800}.name{flex:1}.status{color:#475569;font-size:.9rem;margin-top:10px}@media(max-width:520px){.head{display:block}.controls>*{width:100%}}</style></head><body><main class="wrap"><header class="head"><h1>Europa-Daten · Recherche</h1><a href="./">Zur Schnellansicht</a></header><section class="panel"><div class="controls"><select id="country" aria-label="Land"></select><input id="search" maxlength="4" placeholder="Kürzel filtern" autocomplete="off"></div><p id="warning" class="warning">Rechercheansicht lädt lokale YAML-Dateien.</p><label id="permitLabel" class="consent" hidden><input id="permit" type="checkbox"> <span>Ich möchte auch ungeprüfte Recherchekandidaten anzeigen.</span></label><div id="results" class="results"></div><p id="status" class="status"></p></section></main><script>
'use strict';const catalog=`🇩🇪|D|Deutschland;🇦🇹|A|Österreich;🇨🇭|CH|Schweiz;🇵🇱|PL|Polen;🇺🇦|UA|Ukraine;🇮🇹|I|Italien;🇦🇱|AL|Albanien;🇦🇩|AND|Andorra;🇦🇲|AM|Armenien;🇦🇿|AZ|Aserbaidschan;🇧🇾|BY|Belarus;🇧🇪|B|Belgien;🇧🇦|BIH|Bosnien und Herzegowina;🇧🇬|BG|Bulgarien;🇭🇷|HR|Kroatien;🇨🇾|CY|Zypern;🇨🇿|CZ|Tschechien;🇩🇰|DK|Dänemark;🇪🇪|EST|Estland;🇫🇮|FIN|Finnland;🇫🇷|F|Frankreich;🇬🇪|GE|Georgien;🇬🇷|GR|Griechenland;🇬🇮|GBZ|Gibraltar;🇬🇧|UK|Großbritannien;🇭🇺|H|Ungarn;🇮🇸|IS|Island;🇮🇪|IRL|Irland;🇰🇿|KZ|Kasachstan;🇽🇰|RKS|Kosovo;🇱🇻|LV|Lettland;🇱🇮|FL|Liechtenstein;🇱🇹|LT|Litauen;🇱🇺|L|Luxemburg;🇲🇹|M|Malta;🇲🇩|MD|Moldau;🇲🇨|MC|Monaco;🇲🇪|MNE|Montenegro;🇳🇱|NL|Niederlande;🇲🇰|NMK|Nordmazedonien;🇳🇴|N|Norwegen;🇵🇹|P|Portugal;🇷🇴|RO|Rumänien;🇷🇺|RUS|Russland;🇸🇲|RSM|San Marino;🇷🇸|SRB|Serbien;🇸🇰|SK|Slowakei;🇸🇮|SLO|Slowenien;🇪🇸|E|Spanien;🇸🇪|S|Schweden;🇹🇷|TR|Türkei;🇻🇦|V|Vatikanstadt;🇫🇴|FO|Färöer;🇦🇽|AX|Åland;🇬🇬|GBG|Guernsey;🇯🇪|GBJ|Jersey;🇮🇲|GBM|Isle of Man`;
const $=id=>document.getElementById(id),ui={country:$('country'),warning:$('warning'),permitLabel:$('permitLabel'),permit:$('permit'),search:$('search'),status:$('status'),results:$('results')};let entries=[],coverage='',rule='',countryIso='de',seq=0;function isoFromFlag(flag){return Array.from(flag).map(ch=>String.fromCharCode(ch.codePointAt(0)-127397)).join('').toLowerCase()}for(const row of catalog.split(';')){const[flag,sign,name]=row.split('|'),o=document.createElement('option');o.value=isoFromFlag(flag);o.textContent=`${flag}  ${name} (${sign})`;ui.country.append(o)}ui.country.value='de';function parseLocal(text){let item=null;const out=[];for(const line of text.split(/\r?\n/)){const h=/^([A-ZÄÖÜ]{1,3}):\s*(?:#.*)?$/.exec(line);if(h){if(item?.place)out.push(item);item={code:h[1],place:'',url:''};continue}const f=/^  title:\s*(.*?)\s*$/.exec(line);if(item&&f){let v=f[1];try{v=JSON.parse(v)}catch{}item.place=v}}if(item?.place)out.push(item);return out}
function parseResearch(text){const out=[];let item=null,meta={coverage:'unknown',rule:'',appReady:false};for(const line of text.split(/\r?\n/)){let m=/^coverage:\s*(.+)$/.exec(line);if(m){meta.coverage=JSON.parse(m[1]);continue}m=/^geographic_rule:\s*(.+)$/.exec(line);if(m){meta.rule=JSON.parse(m[1]);continue}m=/^app_ready:\s*(true|false)/.exec(line);if(m){meta.appReady=m[1]==='true';continue}m=/^  - code:\s*(.+)$/.exec(line);if(m){if(item?.place)out.push(item);item={code:JSON.parse(m[1]),place:'',url:''};continue}m=/^    place:\s*(.+)$/.exec(line);if(m&&item){item.place=JSON.parse(m[1]);continue}m=/^    wikidata:\s*(.+)$/.exec(line);if(m&&item)item.url=JSON.parse(m[1])}if(item?.place)out.push(item);return{entries:out,meta}}
function show(){const q=ui.search.value.trim().toUpperCase(),matching=entries.filter(e=>e.code.startsWith(q));ui.results.replaceChildren();if(coverage!=='local'&&!ui.permit.checked){ui.status.textContent='Ungeprüfte Einträge werden erst nach deiner bewussten Auswahl angezeigt.';return}const subset=matching.slice(0,100),fragment=document.createDocumentFragment();for(const e of subset){const a=document.createElement('a');a.className='row';a.href=e.url||'https://de.wikipedia.org/w/index.php?title=Spezial:Suche&search='+encodeURIComponent(e.place)+'&go=Artikel';a.target='_blank';a.rel='noopener noreferrer';const code=document.createElement('span'),place=document.createElement('span'),arrow=document.createElement('small');code.className='code';place.className='name';code.textContent=e.code;place.textContent=e.place;arrow.textContent='↗';a.append(code,place,arrow);fragment.append(a)}ui.results.append(fragment);ui.status.textContent=`${matching.length} passende Einträge; ${subset.length} angezeigt. Tippe weitere Buchstaben, um einzugrenzen.`}
async function load(){const id=++seq;countryIso=ui.country.value;entries=[];coverage='';rule='';ui.permit.checked=false;ui.permitLabel.hidden=true;ui.search.value='';ui.results.replaceChildren();ui.warning.textContent='Lade Manifest …';ui.status.textContent='';try{const manifestResponse=await fetch('./data/europe/manifest.json',{cache:'no-store'});if(!manifestResponse.ok)throw Error(`Manifest nicht ladbar (HTTP ${manifestResponse.status})`);const manifest=await manifestResponse.json(),entry=manifest[countryIso];if(!entry||typeof entry.path!=='string'||!entry.path.trim())throw Error(`Kein gültiger Manifest-Eintrag für ${countryIso}`);const path=new URL(entry.path,new URL('./data/europe/',location.href)).href;const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error(`Datei nicht ladbar (HTTP ${response.status})`);const text=await response.text();if(id!==seq)return;const local=['de','at','ch'].includes(countryIso);if(local){entries=parseLocal(text);if(entries.length<10)throw Error('Lokale Liste unvollständig');coverage='local';ui.warning.textContent=`Lokale Community-Liste mit ${entries.length} Einträgen. Nicht amtlich garantiert vollständig.`}else{const parsed=parseResearch(text);entries=parsed.entries;coverage=parsed.meta.coverage;rule=parsed.meta.rule;ui.permitLabel.hidden=false;ui.warning.textContent=`Status: ${coverage}. ${entries.length} Recherchekandidaten. Nicht geprüft, nicht vollständig und nicht automatisch als Herkunftsort geeignet. ${rule.startsWith('modern_regular_serial_not_geographic')?'Die heutige Standardserie codiert keinen verlässlichen Herkunftsort.':''}`}show()}catch(error){if(id!==seq)return;coverage='error';ui.warning.textContent=`Datei nicht verfügbar: ${error.message}`;ui.status.textContent='Keine Orte behauptet.'}}
ui.country.addEventListener('change',load);ui.permit.addEventListener('change',show);ui.search.addEventListener('input',show);load();
</script></body></html>
