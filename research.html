<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b47"><title>Europa-Kennzeichen: Recherche</title><style>:root{font-family:system-ui,sans-serif;color:#1b3049;background:#edf3f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;min-height:100dvh;margin:auto;background:#fafcff}header{padding:calc(14px + env(safe-area-inset-top)) 14px 15px;background:#142b47;color:#fff}header a{color:#d9eaff}h1{font-size:1.24rem;margin:10px 0 4px}header p{font-size:.84rem;line-height:1.4;margin:0}main{padding:12px 12px 30px}select,input[type=text]{display:block;width:100%;min-height:48px;border:1px solid #aebfd1;border-radius:10px;background:#fff;padding:8px 12px;font-size:1rem;margin:0 0 10px}.warning{background:#fff0cc;color:#5f4212;border-radius:10px;padding:12px;line-height:1.45;font-size:.88rem}.permit{display:block;padding:11px 3px;font-size:.91rem;line-height:1.4}.permit input{width:21px;height:21px;vertical-align:middle;margin-right:6px}.status{font-size:.84rem;color:#516987;margin:10px 2px}.row{display:flex;align-items:center;gap:10px;min-height:67px;padding:10px;margin-bottom:7px;background:white;border:1px solid #d7e3f0;border-radius:11px;color:inherit;text-decoration:none}.code{min-width:62px;text-align:center;border-left:7px solid #2264a6;padding:6px;font-weight:800;font-size:1.12rem}.name{flex:1;font-size:1.12rem;font-weight:720;overflow-wrap:anywhere}.row small{color:#536e8f}button{border:0;background:#164b9b;color:white;padding:12px;border-radius:10px;font-size:1rem}</style></head><body><div class="wrap"><header><a href="./index.html">← Zurück zur Kennzeichen-Sofortsuche</a><h1>Europa-Kennzeichen · Recherche</h1><p>Alle Länderdateien sind hier verknüpft. Ungeprüfte Wikidata-Codes sind keine vollständigen, bestätigten Ortslisten.</p></header><main><select id="country" aria-label="Land auswählen"></select><div id="warning" class="warning" role="status">Lade Quellenstatus …</div><label id="permitLabel" class="permit" hidden><input id="permit" type="checkbox">Ungeprüfte Kandidaten ausdrücklich anzeigen</label><input id="search" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="Kürzel filtern" aria-label="Kürzel filtern"><p id="status" class="status"></p><div id="results"></div></main></div><script>
'use strict';const catalog=`🇩🇪|D|Deutschland;🇦🇹|A|Österreich;🇨🇭|CH|Schweiz;🇵🇱|PL|Polen;🇺🇦|UA|Ukraine;🇮🇹|I|Italien;🇦🇱|AL|Albanien;🇦🇩|AND|Andorra;🇦🇲|AM|Armenien;🇦🇿|AZ|Aserbaidschan;🇧🇾|BY|Belarus;🇧🇪|B|Belgien;🇧🇦|BIH|Bosnien und Herzegowina;🇧🇬|BG|Bulgarien;🇭🇷|HR|Kroatien;🇨🇾|CY|Zypern;🇨🇿|CZ|Tschechien;🇩🇰|DK|Dänemark;🇪🇪|EST|Estland;🇫🇮|FIN|Finnland;🇫🇷|F|Frankreich;🇬🇪|GE|Georgien;🇬🇷|GR|Griechenland;🇬🇮|GBZ|Gibraltar;🇬🇧|UK|Großbritannien;🇭🇺|H|Ungarn;🇮🇸|IS|Island;🇮🇪|IRL|Irland;🇰🇿|KZ|Kasachstan;🇽🇰|RKS|Kosovo;🇱🇻|LV|Lettland;🇱🇮|FL|Liechtenstein;🇱🇹|LT|Litauen;🇱🇺|L|Luxemburg;🇲🇹|M|Malta;🇲🇩|MD|Moldau;🇲🇨|MC|Monaco;🇲🇪|MNE|Montenegro;🇳🇱|NL|Niederlande;🇲🇰|NMK|Nordmazedonien;🇳🇴|N|Norwegen;🇵🇹|P|Portugal;🇷🇴|RO|Rumänien;🇷🇺|RUS|Russland;🇸🇲|RSM|San Marino;🇷🇸|SRB|Serbien;🇸🇰|SK|Slowakei;🇸🇮|SLO|Slowenien;🇪🇸|E|Spanien;🇸🇪|S|Schweden;🇹🇷|TR|Türkei;🇻🇦|V|Vatikanstadt;🇫🇴|FO|Färöer;🇦🇽|AX|Åland;🇬🇬|GBG|Guernsey;🇯🇪|GBJ|Jersey;🇮🇲|GBM|Isle of Man`;
const $=id=>document.getElementById(id),ui={country:$('country'),warning:$('warning'),permitLabel:$('permitLabel'),permit:$('permit'),search:$('search'),status:$('status'),results:$('results')};let entries=[],coverage='',rule='',countryIso='de',seq=0;function isoFromFlag(flag){return Array.from(flag).map(ch=>String.fromCharCode(ch.codePointAt(0)-127397)).join('').toLowerCase()}for(const row of catalog.split(';')){const[flag,sign,name]=row.split('|'),o=document.createElement('option');o.value=isoFromFlag(flag);o.textContent=`${flag}  ${name} (${sign})`;ui.country.append(o)}ui.country.value='de';function parseLocal(text){let item=null;const out=[];for(const line of text.split(/\r?\n/)){const h=/^([A-ZÄÖÜ]{1,3}):\s*(?:#.*)?$/.exec(line);if(h){if(item?.place)out.push(item);item={code:h[1],place:'',url:''};continue}const f=/^  title:\s*(.*?)\s*$/.exec(line);if(item&&f){let v=f[1];try{v=JSON.parse(v)}catch{}item.place=v}}if(item?.place)out.push(item);return out}
function parseResearch(text){const out=[];let item=null,meta={coverage:'unknown',rule:'',appReady:false};for(const line of text.split(/\r?\n/)){let m=/^coverage:\s*(.+)$/.exec(line);if(m){meta.coverage=JSON.parse(m[1]);continue}m=/^geographic_rule:\s*(.+)$/.exec(line);if(m){meta.rule=JSON.parse(m[1]);continue}m=/^app_ready:\s*(true|false)/.exec(line);if(m){meta.appReady=m[1]==='true';continue}m=/^  - code:\s*(.+)$/.exec(line);if(m){if(item?.place)out.push(item);item={code:JSON.parse(m[1]),place:'',url:''};continue}m=/^    place:\s*(.+)$/.exec(line);if(m&&item){item.place=JSON.parse(m[1]);continue}m=/^    wikidata:\s*(.+)$/.exec(line);if(m&&item)item.url=JSON.parse(m[1])}if(item?.place)out.push(item);return{entries:out,meta}}
function show(){const q=ui.search.value.trim().toUpperCase(),matching=entries.filter(e=>e.code.startsWith(q));ui.results.replaceChildren();if(coverage!=='local'&&!ui.permit.checked){ui.status.textContent='Ungeprüfte Einträge werden erst nach deiner bewussten Auswahl angezeigt.';return}const subset=matching.slice(0,100),fragment=document.createDocumentFragment();for(const e of subset){const a=document.createElement('a');a.className='row';a.href=e.url||'https://de.wikipedia.org/w/index.php?title=Spezial:Suche&search='+encodeURIComponent(e.place)+'&go=Artikel';a.target='_blank';a.rel='noopener noreferrer';const code=document.createElement('span'),place=document.createElement('span'),arrow=document.createElement('small');code.className='code';place.className='name';code.textContent=e.code;place.textContent=e.place;arrow.textContent='↗';a.append(code,place,arrow);fragment.append(a)}ui.results.append(fragment);ui.status.textContent=`${matching.length} passende Einträge; ${subset.length} angezeigt. Tippe weitere Buchstaben, um einzugrenzen.`}
async function load(){const id=++seq;countryIso=ui.country.value;entries=[];coverage='';rule='';ui.permit.checked=false;ui.permitLabel.hidden=true;ui.search.value='';ui.results.replaceChildren();ui.warning.textContent='Lade YAML-Datei …';ui.status.textContent='';const local=['de','at','ch'].includes(countryIso),path=local?`./data/${countryIso}.yaml`:`./data/europe/${countryIso}.yaml`;try{const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status} für ${path}`);const text=await response.text();if(id!==seq)return;if(local){entries=parseLocal(text);if(entries.length<10)throw Error('Lokale Liste unvollständig');coverage='local';ui.warning.textContent=`Lokale Community-Liste mit ${entries.length} Einträgen. Nicht amtlich garantiert vollständig.`}else{const parsed=parseResearch(text);entries=parsed.entries;coverage=parsed.meta.coverage;rule=parsed.meta.rule;ui.permitLabel.hidden=false;ui.warning.textContent=`Status: ${coverage}. ${entries.length} Recherchekandidaten. Nicht geprüft, nicht vollständig und nicht automatisch als Herkunftsort geeignet. ${rule.startsWith('modern_regular_serial_not_geographic')?'Die heutige Standardserie codiert keinen verlässlichen Herkunftsort.':''}`}show()}catch(error){if(id!==seq)return;coverage='error';ui.warning.textContent=`Datei nicht verfügbar: ${error.message}`;ui.status.textContent='Keine Orte behauptet.'}}
ui.country.addEventListener('change',load);ui.permit.addEventListener('change',show);ui.search.addEventListener('input',show);load();
</script></body></html>
