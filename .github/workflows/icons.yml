name: Generate PWA icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_icons.py'
      - '.github/workflows/icons.yml'
      - 'icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_icons.py
      - name: Commit generated PNG icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate PNG PWA icons'
            git push
          fi
