name: Vendor license plate data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-plates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate CC0 lists
        run: |
          python - <<'PY'
          import datetime, json, pathlib, re, urllib.request
          directory = pathlib.Path('data')
          directory.mkdir(exist_ok=True)
          info = {}
          for country, minimum in [('de', 400), ('at', 50), ('ch', 10)]:
              urls = [
                  f'https://raw.githubusercontent.com/offene-daten/kennzeichen/master/{country}.yaml',
                  f'https://cdn.jsdelivr.net/gh/offene-daten/kennzeichen@master/{country}.yaml',
              ]
              for url in urls:
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Kennzeichen-Sofortfinder/2.1 data-vendor'})
                      with urllib.request.urlopen(request, timeout=25) as response:
                          text = response.read().decode('utf-8-sig')
                      count = len(re.findall(r'(?m)^[A-ZÄÖÜ]{1,3}:[ \t]*(?:#.*)?$', text))
                      if count < minimum or 'title:' not in text:
                          raise ValueError(f'{country}: unvollständige Quelle ({count})')
                      (directory / f'{country}.yaml').write_text(text, encoding='utf-8')
                      info[country] = {'count': count, 'source': url}
                      break
                  except Exception as error:
                      print(f'{country}: Quelle fehlgeschlagen: {error}')
              else:
                  raise RuntimeError(f'{country}: keine vollständige Quelle erreichbar')
          info['fetched_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          (directory / 'source.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(info)
          PY
      - name: Commit vendored data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/de.yaml data/at.yaml data/ch.yaml data/source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor complete CC0 license plate lists'
            git push
          fi
