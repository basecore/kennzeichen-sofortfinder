name: Research European plate codes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_europe_yaml.py'
      - '.github/workflows/europe-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_europe_yaml.py
      - name: Commit source-labelled country files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/europe/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate European plate code research YAML'
            git push
          fi
