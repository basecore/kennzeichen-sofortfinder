<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b47"><meta name="description" content="Europäische Kennzeichen und Länder direkt auf dem Smartphone nachschlagen."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder Europa</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2e48;background:#e8eff7}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f2a12e;outline-offset:2px}.app{height:100dvh;min-height:490px;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#f7f9fc;box-shadow:0 0 30px #152d4933}.head{background:#142b47;color:white;padding:calc(10px + env(safe-area-inset-top)) 13px 10px}.brand{display:flex;align-items:center;gap:8px;margin-bottom:10px}.brand img{width:37px;height:37px;border-radius:9px}.brand h1{font-size:1.08rem;margin:0}.brand small{font-size:.72rem;color:#c8d9ee}.country{width:100%;height:47px;border-radius:10px;border:1px solid #7894b1;background:#fff;color:#173454;font-size:1.03rem;font-weight:700;padding:0 11px;margin-bottom:10px}.entry{display:flex;gap:7px;align-items:stretch}.plate{flex:1;min-width:0;display:flex;min-height:61px;text-decoration:none;border:2px solid #d9e1eb;border-radius:9px;background:#fff;color:#172d48;overflow:hidden}.band{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:46px;background:#164b9b;color:#fff;line-height:1.1}.band .flag{font-size:1.15rem}.band .countrycode{font-size:.84rem;font-weight:850}.plate .letters{display:flex;align-items:center;min-width:0;padding:0 10px;font-size:1.7rem;font-weight:850;letter-spacing:.08em}.plate .wiki{font-size:.7rem;margin:auto 8px auto auto;white-space:nowrap;color:#426182}.action{min-width:48px;border:0;border-radius:9px;background:#dceafe;color:#183a61;font-size:1.35rem;font-weight:800}.action:disabled{opacity:.5}.note{font-size:.78rem;line-height:1.3;color:#dce9f7;margin:8px 1px 0}.status{padding:7px 13px;font-size:.79rem;background:#e8f0fa;color:#285071}.status.warn{background:#fff0d6;color:#684819}.label{padding:10px 13px 7px;margin:0;font-size:.82rem;font-weight:700;color:#536680}.results{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 10px 7px}.row{width:100%;min-height:61px;border:1px solid #d9e3ef;border-radius:11px;background:#fff;padding:8px;display:flex;align-items:center;gap:11px;text-align:left;color:inherit;margin-bottom:7px}.row.selected{background:#e0efff;border-color:#5c91cc}.code{min-width:58px;text-align:center;background:#f4f8ff;border-left:7px solid #1769aa;border-radius:4px;padding:6px;font-size:1.04rem;font-weight:800}.names{display:flex;flex-direction:column;gap:3px;min-width:0}.names strong{font-size:.99rem;overflow-wrap:anywhere}.names small{color:#5d7188}.empty{line-height:1.5;color:#526782;padding:14px 5px}.foot{background:#e4edf6;border-top:1px solid #d0dbe8;padding:8px 9px calc(9px + env(safe-area-inset-bottom))}.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.key{min-height:47px;border:1px solid #acc1d7;border-radius:9px;background:#fff;color:#193955;font-size:1.14rem;font-weight:800}.key:disabled{background:#d1d8e0;border-color:#c1cad4;color:#8291a2;opacity:.75;cursor:not-allowed}.meta{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:.7rem;color:#53687f;margin:7px 2px 0}@media(max-height:650px){.brand{margin-bottom:5px}.country{height:38px;margin-bottom:5px}.plate{min-height:50px}.row{min-height:49px}.key{min-height:39px}.head{padding-top:calc(5px + env(safe-area-inset-top))}}
</style></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt="Kennzeichen-Logo"><div><h1>Kennzeichen-Sofortfinder</h1><small>Europa entdecken · Deutschland voreingestellt</small></div></div><select id="country" class="country" aria-label="Land auswählen"></select><div class="entry"><a id="plate" class="plate" href="#" target="_blank" rel="noopener noreferrer" aria-label="Ausgewähltes Kennzeichen bei Wikipedia öffnen"><span class="band"><span id="flag" class="flag"></span><span id="countrycode" class="countrycode"></span></span><span id="query" class="letters">–</span><span class="wiki">Wikipedia ↗</span></a><button id="back" class="action" aria-label="Letzten Buchstaben löschen">⌫</button><button id="clear" class="action" aria-label="Neue Suche">×</button></div><p id="note" class="note">Kennzeichen antippen: Wikipedia öffnet sich</p></header><div id="status" class="status" role="status">Lade Kennzeichen …</div><p id="label" class="label">Passende Kürzel</p><section id="results" class="results" aria-label="Kennzeichen-Treffer"></section><footer class="foot"><div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div><div class="meta"><span>v2.0.0 · 30.09.2026</span><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub-Projekt ↗</a><span>Ortsangaben ohne Gewähr</span></div></footer></main>
<script>
'use strict';const rows=`🇩🇪|D|Deutschland|Germany|1;🇦🇹|A|Österreich|Austria|1;🇵🇱|PL|Polen|Poland|1;🇺🇦|UA|Ukraine|Ukraine|0;🇮🇹|I|Italien|Italy|1;🇦🇱|AL|Albanien|Albania|0;🇦🇩|AND|Andorra|Andorra|0;🇦🇲|AM|Armenien|Armenia|0;🇦🇿|AZ|Aserbaidschan|Azerbaijan|0;🇧🇾|BY|Belarus|Belarus|0;🇧🇪|B|Belgien|Belgium|1;🇧🇦|BIH|Bosnien und Herzegowina|Bosnia and Herzegovina|0;🇧🇬|BG|Bulgarien|Bulgaria|1;🇭🇷|HR|Kroatien|Croatia|1;🇨🇾|CY|Zypern|Cyprus|1;🇨🇿|CZ|Tschechien|Czech Republic|1;🇩🇰|DK|Dänemark|Denmark|1;🇪🇪|EST|Estland|Estonia|1;🇫🇮|FIN|Finnland|Finland|1;🇫🇷|F|Frankreich|France|1;🇬🇪|GE|Georgien|Georgia|0;🇬🇷|GR|Griechenland|Greece|1;🇬🇮|GBZ|Gibraltar|Gibraltar|0;🇬🇧|UK|Großbritannien|United Kingdom|0;🇭🇺|H|Ungarn|Hungary|1;🇮🇸|IS|Island|Iceland|0;🇮🇪|IRL|Irland|Ireland|1;🇰🇿|KZ|Kasachstan|Kazakhstan|0;🇽🇰|RKS|Kosovo|Kosovo|0;🇱🇻|LV|Lettland|Latvia|1;🇱🇮|FL|Liechtenstein|Liechtenstein|0;🇱🇹|LT|Litauen|Lithuania|1;🇱🇺|L|Luxemburg|Luxembourg|1;🇲🇹|M|Malta|Malta|1;🇲🇩|MD|Moldau|Moldova|0;🇲🇨|MC|Monaco|Monaco|0;🇲🇪|MNE|Montenegro|Montenegro|0;🇳🇱|NL|Niederlande|Netherlands|1;🇲🇰|NMK|Nordmazedonien|North Macedonia|0;🇳🇴|N|Norwegen|Norway|0;🇵🇹|P|Portugal|Portugal|1;🇷🇴|RO|Rumänien|Romania|1;🇷🇺|RUS|Russland|Russia|0;🇸🇲|RSM|San Marino|San Marino|0;🇷🇸|SRB|Serbien|Serbia|0;🇸🇰|SK|Slowakei|Slovakia|1;🇸🇮|SLO|Slowenien|Slovenia|1;🇪🇸|E|Spanien|Spain|1;🇸🇪|S|Schweden|Sweden|1;🇨🇭|CH|Schweiz|Switzerland|0;🇹🇷|TR|Türkei|Turkey|0;🇻🇦|V|Vatikanstadt|Vatican City|0;🇫🇴|FO|Färöer|Faroe Islands|0;🇦🇽|AX|Åland|Åland Islands|0;🇬🇬|GBG|Guernsey|Guernsey|0;🇯🇪|GBJ|Jersey|Jersey|0;🇮🇲|GBM|Isle of Man|Isle of Man|0`;const countries=rows.split(';').map(row=>{const[flag,code,name,en,eu]=row.split('|');return{flag,code,name,en,eu:eu==='1'}}),byCode=Object.fromEntries(countries.map(c=>[c.code,c])),$=id=>document.getElementById(id),ui={country:$('country'),plate:$('plate'),flag:$('flag'),countrycode:$('countrycode'),query:$('query'),back:$('back'),clear:$('clear'),note:$('note'),status:$('status'),label:$('label'),results:$('results'),keys:$('keys')};let country=byCode.D,records=[],query='',selected=null,partial=false;
const uk=`Stadt Kyjiw|AA KA;Oblast Winnyzja|AB KB;Oblast Wolyn|AC KC;Oblast Dnipropetrowsk|AE KE;Oblast Donezk|AH KH;Oblast Kyjiw|AI KI;Autonome Republik Krim|AK KK;Oblast Schytomyr|AM KM;Oblast Transkarpatien|AO KO;Oblast Saporischschja|AP KP;Oblast Iwano-Frankiwsk|AT KT;Oblast Charkiw|AX KX;Oblast Kirowohrad|BA HA;Oblast Luhansk|BB HB;Oblast Lwiw|BC HC;Oblast Mykolajiw|BE HE;Oblast Odessa|BH HH;Oblast Poltawa|BI HI;Oblast Riwne|BK HK;Oblast Sumy|BM HM;Oblast Ternopil|BO HO;Oblast Cherson|BT HT;Oblast Chmelnyzkyj|BX HX;Oblast Tscherkassy|CA IA;Oblast Tschernihiw|CB IB;Oblast Tscherniwzi|CE IE;Stadt Sewastopol|CH IH;Gesamtstaatlich|II`;
const plSample=`Warschau (Białołęka)|WA;Warschau (Mokotów)|WE AE;Warschau (Bielany)|WD;Krakau (Stadt)|KR KK JR;Krakau (Landkreis)|KRA;Danzig|GD XD;Danzig (Landkreis)|GDA;Posen|PO PY MO;Breslau|DW DX VW;Stettin|ZS;Łódź|EL ED;Kattowitz|SK IK;Lublin|LU;Białystok|BI;Gdynia|GA;Kielce|TK;Rzeszów|RZ YZ;Bydgoszcz|CB;Toruń|CT;Opole|OP`;
const itSample=`Mailand|MI;Rom|RM;Turin|TO;Neapel|NA;Florenz|FI;Venedig|VE;Bologna|BO;Genua|GE;Verona|VR;Padua|PD;Triest|TS;Palermo|PA;Bari|BA;Bozen|BZ;Trient|TN;Modena|MO;Pisa|PI;Catania|CT;Perugia|PG;Rimini|RN`;
function decodeMap(text){return text.split(';').flatMap(line=>{const[title,codes]=line.split('|');return codes.split(' ').map(code=>({code,title,state:''}))}).sort((a,b)=>a.code.localeCompare(b.code,'de'))}function store(k,v){try{localStorage.setItem(k,v)}catch{}}function cached(k){try{return localStorage.getItem(k)}catch{return null}}function yaml(text,minimum){let item=null;const out=[];for(const line of text.split(/\r?\n/)){const head=/^([A-ZÄÖÜ]{1,3}):\s*(?:#.*)?$/.exec(line);if(head){if(item?.title)out.push(item);item={code:head[1],title:'',state:''};continue}if(!item)continue;const f=/^  (title|state):\s*(.*?)\s*$/.exec(line);if(f){let value=f[2].replace(/\s+#.*$/,'');if(value.startsWith('"')&&value.endsWith('"')){try{value=JSON.parse(value)}catch{value=value.slice(1,-1)}}item[f[1]]=value}}if(item?.title)out.push(item);if(out.length<minimum)throw Error('unvollständig');return out.sort((a,b)=>a.code.localeCompare(b.code,'de'))}
function wikiCountry(){return'https://en.wikipedia.org/w/index.php?title=Special:Search&search='+encodeURIComponent('Vehicle registration plates of '+country.en)+'&go=Go'}function wikiPlace(title){return'https://de.wikipedia.org/w/index.php?title=Spezial:Suche&search='+encodeURIComponent(title)+'&go=Artikel'}function status(text,warn=false){ui.status.textContent=text;ui.status.classList.toggle('warn',warn)}function card(row){const b=document.createElement('button');b.type='button';b.className='row'+(selected===row?' selected':'');const code=document.createElement('span');code.className='code';code.textContent=row.code;const n=document.createElement('span');n.className='names',title=document.createElement('strong'),state=document.createElement('small');title.textContent=row.title;state.textContent=row.state||country.name;n.append(title,state);b.append(code,n);b.addEventListener('click',()=>{query=row.code;selected=row;render();ui.results.scrollTop=0});return b}
function render(){ui.flag.textContent=country.eu?'✦':country.flag;ui.countrycode.textContent=country.code;ui.query.textContent=query||'–';ui.plate.href=selected?wikiPlace(selected.title):wikiCountry();ui.plate.title=selected?'Wikipedia: '+selected.title:'Wikipedia: Kennzeichen in '+country.name;ui.back.disabled=ui.clear.disabled=!query;ui.results.replaceChildren();const matches=query?records.filter(r=>r.code.startsWith(query)):records.slice(0,60);ui.label.textContent=query?`${matches.length} Treffer für „${query}“`:'Kürzel nach Alphabet';if(!matches.length){const p=document.createElement('p');p.className='empty';p.textContent=records.length?'Kein passendes Kürzel. ⌫ zurück oder × neu.':'Für dieses Land ist keine geprüfte Ortsliste hinterlegt oder sie lädt noch. Tippe auf das Kennzeichen für Wikipedia.';ui.results.append(p)}else{if(query)for(const row of matches.filter(r=>r.code===query))ui.results.append(card(row));for(const row of matches)if(!query||row.code!==query)ui.results.append(card(row))}for(const key of ui.keys.children)key.disabled=query.length>=3||!records.some(r=>r.code.startsWith(query+key.textContent))}function change(value){query=value;selected=null;render();ui.results.scrollTop=0}
for(const c of countries){const option=document.createElement('option');option.value=c.code;option.textContent=`${c.flag}  ${c.name} (${c.code})`;ui.country.append(option)}ui.country.value='D';for(const letter of'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'){const b=document.createElement('button');b.type='button';b.className='key';b.textContent=letter;b.setAttribute('aria-label','Buchstabe '+letter);b.addEventListener('click',()=>{if(!b.disabled)change(query+letter)});ui.keys.append(b)}ui.back.addEventListener('click',()=>change(query.slice(0,-1)));ui.clear.addEventListener('click',()=>change(''));ui.country.addEventListener('change',()=>select(ui.country.value));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target instanceof HTMLButtonElement||e.target===ui.country)return;const ch=e.key.toUpperCase();if(/^[A-ZÄÖÜ]$/.test(ch)&&query.length<3&&records.some(r=>r.code.startsWith(query+ch)))change(query+ch);else if(e.key==='Backspace'){e.preventDefault();change(query.slice(0,-1))}else if(e.key==='Escape')change('')});
async function polish(){const url='https://en.wikipedia.org/w/api.php?action=parse&page=Vehicle_registration_plates_of_Poland&prop=text&format=json&origin=*';const res=await fetch(url);if(!res.ok)throw Error('Wikipedia nicht erreichbar');const json=await res.json(),doc=new DOMParser().parseFromString(json.parse.text['*'],'text/html'),out=[];for(const table of doc.querySelectorAll('table.wikitable')){const text=table.textContent;if(!text.includes('Lower Silesian Voivodeship')&&!text.includes('Lubusz Voivodeship')&&!text.includes('Podkarpackie Voivodeship')&&!text.includes('Świętokrzyskie Voivodeship'))continue;for(const td of table.querySelectorAll('td')){const t=td.textContent.replace(/\s+/g,' ').trim(),rx=/(?:^|\s)([A-Z]{2,3}(?:\s*,\s*[A-Z]{2,3})*)\s*[–—-]\s*(.*?)(?=\s+[A-Z]{2,3}(?:\s*,\s*[A-Z]{2,3})*\s*[–—-]|$)/g;for(const match of t.matchAll(rx)){const title=match[2].trim();if(title.length<2||title.length>90)continue;for(const code of match[1].split(/\s*,\s*/))out.push({code,title,state:'Polen'})}}}if(out.length<150)throw Error('Wikipedia-Tabelle nicht auswertbar');return out.sort((a,b)=>a.code.localeCompare(b.code,'de'))}
async function select(code){country=byCode[code]||byCode.D;query='';selected=null;records=[];partial=false;ui.note.textContent=country.code==='I'?'Italien: links steht I, ein Provinzcode rechts ist optional. Serienbuchstaben verraten keinen Ort.':'Land wählen, Kürzel tippen und für Wikipedia auf das Kennzeichen tippen.';if(country.code==='UA'){records=decodeMap(uk);status('Ukraine: regionale Codes 2004/2013, einschließlich überregionaler II');render();return}if(country.code==='I'){records=decodeMap(itSample);partial=true;status('Nur ausgewählte optionale Provinzcodes rechts · nicht die Seriennummer',true);render();return}if(!['D','A','PL','CH'].includes(code)){status(country.name+' ('+country.code+'): Länderkennung · keine Ortsdaten hinterlegt',true);render();return}const key='kenneurope-v2-'+code,old=cached(key);if(old)try{records=code==='PL'?JSON.parse(old):yaml(old,code==='D'?400:12);status('Gespeicherte Ortsliste · Aktualisierung läuft');render()}catch{}if(code==='PL'&&!records.length){records=decodeMap(plSample);partial=true;status('Polen: begrenzte Offline-Auswahl · lade vollständige Liste',true);render()}if(!records.length){status('Lade Ortsliste für '+country.name+' …');render()}try{let fresh,text;if(code==='PL'){fresh=await polish();text=JSON.stringify(fresh)}else{const path=code==='D'?'de':code==='A'?'at':'ch';const res=await fetch('https://raw.githubusercontent.com/offene-daten/kennzeichen/master/'+path+'.yaml',{cache:'no-store'});if(!res.ok)throw Error('Datenquelle nicht erreichbar');text=await res.text();fresh=yaml(text,code==='D'?400:12)}if(country.code!==code)return;records=fresh;partial=false;store(key,text);status(records.length+' Kürzel · für Offline-Nutzung gespeichert');render()}catch{if(country.code!==code)return;status(records.length?(partial?'Nur ausgewählte Kürzel verfügbar':'Gespeicherte Liste (offline)'):'Keine Ortsliste geladen. Wikipedia-Link bleibt nutzbar.',true);render()}}
render();select('D');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
