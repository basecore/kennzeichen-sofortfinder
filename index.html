<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16345a"><meta name="description" content="Deutsche Autokennzeichen mit wenigen Fingertipps finden.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Kennzeichen-Sofortfinder</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17283e;background:#eef3f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fdaf36;outline-offset:2px}.app{height:100dvh;min-height:460px;display:flex;flex-direction:column;max-width:650px;margin:auto;background:#f8fafc;box-shadow:0 0 28px #18385b18}.top{background:#16345a;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 14px}.top h1{font-size:1.18rem;margin:0 0 12px}.line{display:flex;align-items:center;gap:10px}.query{flex:1;min-width:0;background:#fff;color:#16345a;border-radius:13px;padding:9px 14px;font-weight:800;font-size:1.8rem;letter-spacing:.13em;line-height:1.35}.action{border:0;border-radius:12px;min-width:53px;min-height:53px;background:#dceaff;color:#153256;font-size:1.4rem;font-weight:700}.action:disabled{opacity:.48}.hint{font-size:.82rem;margin:9px 2px 0;color:#d5e6fc}.status{padding:9px 16px;font-size:.83rem;background:#e9f1fb;color:#24445d}.status.bad{background:#fff1d5;color:#654711}.label{margin:0;padding:11px 16px 8px;font-size:.84rem;font-weight:700;color:#546579}.results{overflow:auto;flex:1;overscroll-behavior:contain;padding:0 12px 16px}.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid #dae4f1;background:white;border-radius:14px;padding:12px;margin:0 0 8px;min-height:67px;color:inherit}.row:active,.row.selected{background:#e2efff;border-color:#5a91d0}.plate{flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:2px solid #182f4d;border-left:10px solid #1762af;border-radius:6px;min-width:71px;padding:5px 6px;font-size:1.15rem;font-weight:850;letter-spacing:.05em}.names{min-width:0;display:flex;flex-direction:column;gap:3px}.city{font-weight:750;font-size:1.04rem;overflow-wrap:anywhere}.state{font-size:.81rem;color:#5b6c80}.empty{padding:18px 8px;color:#52647b;line-height:1.5}.keyboard{flex:none;background:#e4ecf5;border-top:1px solid #d2dfed;padding:9px 10px calc(11px + env(safe-area-inset-bottom))}.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.key{border:1px solid #b6c8da;background:white;color:#1b3554;border-radius:11px;min-height:49px;font-weight:800;font-size:1.16rem;touch-action:manipulation;box-shadow:0 2px 0 #bed0e1}.key:active{transform:translateY(2px);box-shadow:none}.key:disabled{opacity:.35}.foot{font-size:.72rem;text-align:center;margin:7px 0 0;color:#51677f}.foot a{color:inherit}@media(max-height:620px){.top{padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:7px}.top h1{margin-bottom:6px}.row{min-height:53px;padding:7px}.keyboard{padding-top:5px}.key{min-height:40px}.hint{margin-top:4px}}
</style>
</head>
<body>
<main class="app"><header class="top"><h1>🚗 Kennzeichen-Sofortfinder</h1><div class="line"><div class="query" id="query" aria-live="polite">–</div><button class="action" id="back" aria-label="Letzten Buchstaben löschen" title="Zurück">⌫</button><button class="action" id="clear" aria-label="Neue Suche" title="Neu">×</button></div><p class="hint">Kennzeichen-Buchstaben antippen · maximal drei</p></header><div class="status" id="status" role="status">Kennzeichenliste wird geladen …</div><p class="label" id="label">Zuletzt gesucht</p><section class="results" id="results" aria-label="Passende Kennzeichen"></section><div class="keyboard"><div class="keys" id="keys"></div><p class="foot">Daten: <a href="https://github.com/offene-daten/kennzeichen" target="_blank" rel="noopener">offene-daten/kennzeichen (CC0)</a> · <a href="https://www.kba.de/DE/Service/Kennzeichen/kennzeichen_node.html" target="_blank" rel="noopener">KBA-Abgleich</a></p></div></main>
<script>
'use strict';
const SOURCE='https://raw.githubusercontent.com/offene-daten/kennzeichen/master/de.yaml';
const DATA_KEY='kennzeichen-yaml-v1',RECENT_KEY='kennzeichen-recent-v1';
const $=id=>document.getElementById(id);
const el={query:$('query'),back:$('back'),clear:$('clear'),status:$('status'),label:$('label'),results:$('results'),keys:$('keys')};
let records=[],code='',recent=[],selected='';
function stored(key){try{return localStorage.getItem(key)}catch{return null}}
function save(key,val){try{localStorage.setItem(key,val)}catch{}}
try{recent=JSON.parse(stored(RECENT_KEY)||'[]').filter(x=>/^[A-ZÄÖÜ]{1,3}$/.test(x)).slice(0,8)}catch{}
function parseYaml(text){const out=[],lines=text.split(/\r?\n/);let item=null;for(const line of lines){const head=/^([A-ZÄÖÜ]{1,3}):\s*(?:#.*)?$/.exec(line);if(head){if(item?.title)out.push(item);item={code:head[1],title:'',state:''};continue}if(!item)continue;const field=/^  (title|state):\s*(.*?)\s*$/.exec(line);if(field){let val=field[2].replace(/\s+#.*$/,'');if(val.startsWith('"')&&val.endsWith('"')){try{val=JSON.parse(val)}catch{val=val.slice(1,-1)}}else if(val.startsWith("'")&&val.endsWith("'")){val=val.slice(1,-1).replace(/''/g,"'")}item[field[1]]=val}}if(item?.title)out.push(item);if(out.length<400)throw Error('Kennzeichenliste unvollständig');return out.sort((a,b)=>a.code.localeCompare(b.code,'de'))}
function status(text,bad=false){el.status.textContent=text;el.status.classList.toggle('bad',bad)}
function remember(value){recent=[value,...recent.filter(x=>x!==value)].slice(0,8);save(RECENT_KEY,JSON.stringify(recent))}
function change(next){code=next;selected='';render()}
function card(item){const b=document.createElement('button');b.type='button';b.className='row'+(selected===item.code?' selected':'');const plate=document.createElement('span');plate.className='plate';plate.textContent=item.code;const box=document.createElement('span');box.className='names';const city=document.createElement('span');city.className='city';city.textContent=item.title;const state=document.createElement('span');state.className='state';state.textContent=item.state||'Deutschland';box.append(city,state);b.append(plate,box);b.addEventListener('click',()=>{code=item.code;selected=item.code;remember(item.code);render();el.results.scrollTop=0});return b}
function render(){el.query.textContent=code||'–';el.back.disabled=!code;el.clear.disabled=!code;el.results.replaceChildren();const matches=code?records.filter(x=>x.code.startsWith(code)):recent.map(x=>records.find(r=>r.code===x)).filter(Boolean);el.label.textContent=code?`${matches.length} Treffer für „${code}“`:'Zuletzt gesucht';if(!matches.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=!records.length?'Zum Start ist einmal Internet erforderlich, um die Kennzeichenliste zu laden.':code?'Kein Treffer. Prüfe die Buchstaben oder tippe auf ⌫.':'Tippe den ersten Buchstaben des Kennzeichens an.';el.results.append(empty)}else{if(code){const exact=matches.find(x=>x.code===code);if(exact)el.results.append(card(exact))}for(const r of matches){if(code&&r.code===code)continue;el.results.append(card(r))}}for(const key of el.keys.children)key.disabled=code.length>=3||!records.length}
for(const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'){const b=document.createElement('button');b.type='button';b.className='key';b.textContent=letter;b.setAttribute('aria-label','Buchstabe '+letter);b.addEventListener('click',()=>{if(code.length<3){change(code+letter);el.results.scrollTop=0}});el.keys.append(b)}
el.back.addEventListener('click',()=>change(code.slice(0,-1)));el.clear.addEventListener('click',()=>change(''));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target instanceof HTMLButtonElement)return;const k=e.key.toUpperCase();if(/^[A-ZÄÖÜ]$/.test(k)&&code.length<3){change(code+k);el.results.scrollTop=0}else if(e.key==='Backspace'){e.preventDefault();change(code.slice(0,-1))}else if(e.key==='Escape')change('')});
async function load(){const cached=stored(DATA_KEY);if(cached){try{records=parseYaml(cached);status(`${records.length} Kürzel · lokal gespeichert · Aktualisierung läuft`);render()}catch{}}try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);let res;try{res=await fetch(SOURCE,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}if(!res.ok)throw Error('HTTP '+res.status);const text=await res.text();const updated=parseYaml(text);records=updated;save(DATA_KEY,text);status(`${records.length} Kürzel · auch ohne Netz nach dem ersten Laden nutzbar`);render()}catch(err){status(records.length?`${records.length} Kürzel · gespeicherte Liste (offline)`:'Liste nicht verfügbar. Internet prüfen und Seite neu laden.',!records.length);render()}}
render();load();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
