<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b47"><meta name="description" content="Europäische Kennzeichen nachschlagen und Orte direkt bei Wikipedia öffnen."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder Europa</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2e48;background:#e8eff7}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f2a12e;outline-offset:2px}.app{height:100dvh;min-height:490px;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#f7f9fc;box-shadow:0 0 30px #152d4933}.head{background:#142b47;color:white;padding:calc(10px + env(safe-area-inset-top)) 13px 10px}.brand{display:flex;align-items:center;gap:8px;margin-bottom:9px}.brand img{width:37px;height:37px;border-radius:9px}.brand h1{font-size:1.08rem;margin:0}.brand small{font-size:.72rem;color:#c8d9ee}.country{width:100%;height:45px;border-radius:10px;border:1px solid #7894b1;background:white;color:#173454;font-size:1.02rem;font-weight:700;padding:0 10px;margin-bottom:8px}.entry{display:flex;gap:7px;align-items:stretch}.plate{flex:1;min-width:0;display:flex;min-height:60px;border:2px solid #d9e1eb;border-radius:9px;background:white;color:#172d48;overflow:hidden}.band{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;background:#164b9b;color:#fff;line-height:1.1}.band .flag{font-size:1.18rem;min-height:22px}.band .countrycode{font-size:.82rem;font-weight:850}.letters{display:flex;align-items:center;padding:0 10px;font-size:1.68rem;font-weight:850;letter-spacing:.08em}.action{min-width:48px;border:0;border-radius:9px;background:#dceafe;color:#183a61;font-size:1.35rem;font-weight:800}.action:disabled{opacity:.5}.note{font-size:.78rem;line-height:1.3;color:#dce9f7;margin:7px 1px 0}.status{padding:8px 13px;font-size:.8rem;background:#e8f0fa;color:#285071}.status.warn{background:#fff0d6;color:#684819}.label{padding:10px 13px 7px;margin:0;font-size:.83rem;font-weight:700;color:#536680}.results{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 10px 7px}.row{width:100%;min-height:75px;border:1px solid #d9e3ef;border-radius:12px;background:white;padding:10px;display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none;color:inherit;margin-bottom:8px}.row:active{background:#e0efff;border-color:#5c91cc}.code{min-width:59px;text-align:center;background:#f4f8ff;border-left:7px solid #1769aa;border-radius:4px;padding:7px;font-size:1.17rem;font-weight:850}.names{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.names strong{font-size:1.24rem;line-height:1.14;font-weight:780;overflow-wrap:anywhere}.names small{font-size:.78rem;color:#5d7188}.arrow{font-size:1.15rem;color:#4674a3}.empty{line-height:1.5;color:#526782;padding:14px 5px}.foot{background:#e4edf6;border-top:1px solid #d0dbe8;padding:8px 9px calc(9px + env(safe-area-inset-bottom))}.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.key{min-height:47px;border:1px solid #acc1d7;border-radius:9px;background:white;color:#193955;font-size:1.14rem;font-weight:800}.key:disabled{background:#d1d8e0;border-color:#c1cad4;color:#8291a2;opacity:.75;cursor:not-allowed}.meta{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:.7rem;color:#53687f;margin:7px 2px 0}@media(max-height:650px){.brand{margin-bottom:5px}.country{height:38px;margin-bottom:5px}.plate{min-height:50px}.row{min-height:63px}.key{min-height:39px}.head{padding-top:calc(5px + env(safe-area-inset-top))}}
</style><script src="./app.js?v=2.2.0" defer></script></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt="Kennzeichen-Logo"><div><h1>Kennzeichen-Sofortfinder</h1><small>Europa entdecken · Deutschland vorausgewählt</small></div></div><select id="country" class="country" aria-label="Land auswählen"></select><div class="entry"><div class="plate" aria-label="Gewähltes Land und Kürzel"><span class="band"><span id="flag" class="flag"></span><span id="countrycode" class="countrycode"></span></span><span id="query" class="letters">–</span></div><button id="back" class="action" aria-label="Letzten Buchstaben löschen">⌫</button><button id="clear" class="action" aria-label="Neue Suche">×</button></div><p id="note" class="note">Unten ein Ergebnis antippen: Wikipedia zum Ort öffnet sich</p></header><div id="status" class="status" role="status">Lade vollständige Ortsliste …</div><p id="label" class="label">Kennzeichen</p><section id="results" class="results" aria-label="Anklickbare Kennzeichen-Treffer"></section><footer class="foot"><div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div><div class="meta"><span>v2.2.0 · 30.09.2026</span><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub-Projekt ↗</a><span>Ortsangaben ohne Gewähr</span></div></footer></main></body></html>
