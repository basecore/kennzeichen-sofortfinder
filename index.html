<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="Kennzeichen in Europa mit vollständiger lokaler Kürzelliste für Deutschland nachschlagen."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2c;--line:#273554;--text:#edf2ff;--muted:#aebbd6;--accent:#ffda43;--danger:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172447 0,#0b1020 48%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{display:flex;gap:12px;align-items:center}.brand img{width:52px;height:52px}.eyebrow{color:var(--accent);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}.brand h1{font-size:1.45rem;margin:.1rem 0}.sub{color:var(--muted);margin:.2rem 0 0}.chip{font-weight:800;border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--accent)}.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}.selectrow,.searchrow{display:flex;gap:10px;align-items:center}.selectrow select,.searchrow button,.key{font:inherit;color:inherit;background:#0f1627;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.selectrow select{flex:1}.searchrow{margin-top:12px}.searchrow output{min-width:3ch;text-align:center;color:var(--accent);font-weight:800}.searchrow button{width:42px;height:42px;padding:0;font-size:1.2rem}.keys{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:14px}.key{padding:7px 0;color:var(--accent);cursor:pointer}.key:disabled,.searchrow button:disabled{opacity:.35;cursor:not-allowed}.status{min-height:24px;color:var(--muted);margin-top:14px}.status.warn{color:var(--danger)}.label{font-weight:700;margin:15px 0 8px}.results{display:grid;gap:8px;max-height:52vh;overflow:auto}.row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.code{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}.names{display:grid;gap:2px}.names small{color:var(--muted)}.arrow{color:var(--accent)}.empty{color:var(--muted);padding:10px 0}.retry{font:inherit;color:inherit;background:#0f1627;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.foot{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0;color:var(--muted);font-size:.9rem}.foot a{color:var(--accent)}@media(max-width:560px){.app{padding:14px}.head{display:block}.chip{display:inline-block;margin-top:10px}.keys{grid-template-columns:repeat(9,1fr)}.row{grid-template-columns:54px 1fr auto}}
</style><script src="./app.js?v=2.3.2" defer></script></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt="Kennzeichen-Sofortfinder"><div><div class="eyebrow">Sofort nachschlagen</div><h1>Kennzeichen-Sofortfinder</h1><p class="sub">Buchstaben eingeben und den passenden Ort öffnen</p></div></div><div class="chip" id="countrycode">D</div></header><section class="box"><div class="selectrow"><label for="country">Land</label><select id="country" aria-label="Land auswählen"></select></div><div class="searchrow"><button id="back" type="button" aria-label="Letzten Buchstaben löschen" disabled>⌫</button><output id="query" aria-live="polite">–</output><button id="clear" type="button" aria-label="Suche leeren" disabled>×</button></div><div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div><div class="status" id="status" aria-live="polite"></div><div class="label" id="label"></div><div id="results" class="results"></div><p class="empty" id="note"></p></section><footer class="foot"><span>v2.3.2 · 30.09.2026</span><a href="./research.html">Europa-Daten (Recherche) ↗</a><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer></main><svg id="euMark" hidden width="0" height="0" aria-hidden="true"></svg></body></html>
