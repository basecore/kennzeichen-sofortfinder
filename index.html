<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#142b47"><meta name="description" content="Kennzeichen sehen, Buchstaben antippen, Ort sofort finden. Werbefrei und offline nach dem ersten Laden."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#192b43;background:#eaf0f6;color-scheme:light}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #e68b20;outline-offset:2px}.app{height:100dvh;min-height:460px;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#f7f9fc;box-shadow:0 10px 40px #142b4726}.head{background:#142b47;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 15px 13px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:11px}.brand img{width:43px;height:43px;border-radius:11px}.brand h1{font-size:1.12rem;line-height:1.2;margin:0}.brand p{font-size:.73rem;color:#cfdef0;margin:2px 0 0}.entry{display:flex;gap:8px}.query{flex:1;min-width:0;background:#fff;color:#142b47;border-radius:12px;padding:8px 12px;font-size:1.65rem;font-weight:850;letter-spacing:.12em;line-height:1.38}.action{flex:none;min-width:51px;min-height:51px;border:0;border-radius:12px;background:#d7e8fb;color:#193a60;font-size:1.4rem;font-weight:800}.action:disabled{opacity:.5}.tip{font-size:.76rem;color:#d7e7fb;margin:8px 0 0}.status{padding:8px 14px;background:#e6f1ff;font-size:.78rem;color:#244761}.status.bad{background:#ffedc8;color:#63450c}.label{font-size:.83rem;font-weight:700;color:#5a6980;padding:10px 14px 7px;margin:0}.results{overflow:auto;overscroll-behavior:contain;flex:1;padding:0 11px 8px}.row{width:100%;min-height:63px;background:#fff;border:1px solid #dbe5f0;border-radius:13px;padding:9px 10px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit;margin-bottom:7px}.row:active,.row.selected{background:#e0efff;border-color:#5790d0}.plate{flex:none;min-width:70px;text-align:center;border:2px solid #1b344f;border-left:9px solid #1966a7;background:#fff;border-radius:5px;padding:5px;font-size:1.15rem;font-weight:850}.info{display:flex;flex-direction:column;gap:2px;min-width:0}.place{font-weight:730;font-size:1.01rem;overflow-wrap:anywhere}.region{font-size:.78rem;color:#596d84}.empty{padding:15px 5px;color:#52647b;line-height:1.5}.bottom{background:#e4edf6;border-top:1px solid #cfdae8;padding:8px 9px calc(8px + env(safe-area-inset-bottom))}.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.key{min-height:48px;border:1px solid #afc4da;border-radius:10px;background:white;color:#173452;font-size:1.15rem;font-weight:800;touch-action:manipulation}.key:active{background:#d4e8ff}.key:disabled{opacity:.4}.meta{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.71rem;color:#4f647e;margin:8px 3px 0}.meta a{text-decoration:underline}@media(max-height:640px){.head{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}.brand{margin-bottom:5px}.brand img{width:34px;height:34px}.row{min-height:50px;padding:6px}.key{min-height:39px}.tip{margin-top:4px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt="Kennzeichen-Sofortfinder-Logo"><div><h1>Kennzeichen-Sofortfinder</h1><p>Sehen · tippen · wissen</p></div></div><div class="entry"><div id="query" class="query" aria-live="polite">–</div><button id="back" class="action" aria-label="Letzten Buchstaben entfernen">⌫</button><button id="clear" class="action" aria-label="Neue Suche">×</button></div><p class="tip">Die ersten 1–3 Buchstaben vom Nummernschild antippen</p></header><div id="status" class="status" role="status">Kennzeichenliste wird geladen …</div><p id="label" class="label">Zuletzt angesehen</p><section id="results" class="results" aria-label="Kennzeichen-Treffer"></section><footer class="bottom"><div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div><div class="meta"><span>Version 1.1.0 · 30.09.2026</span><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub-Projekt ↗</a><a href="https://www.kba.de/DE/Service/Kennzeichen/kennzeichen_node.html" target="_blank" rel="noopener noreferrer">KBA-Quelle ↗</a></div></footer></main>
<script>
'use strict';const SOURCE='https://raw.githubusercontent.com/offene-daten/kennzeichen/master/de.yaml',DATA_KEY='kennzeichen-yaml-v1',RECENT_KEY='kennzeichen-recent-v1';const $=id=>document.getElementById(id);const ui={query:$('query'),back:$('back'),clear:$('clear'),status:$('status'),label:$('label'),results:$('results'),keys:$('keys')};let records=[],query='',recent=[],selected='';function read(k){try{return localStorage.getItem(k)}catch{return null}}function save(k,v){try{localStorage.setItem(k,v)}catch{}}try{recent=JSON.parse(read(RECENT_KEY)||'[]').filter(x=>/^[A-ZÄÖÜ]{1,3}$/.test(x)).slice(0,8)}catch{}
function parse(text){let current=null;const out=[];for(const line of text.split(/\r?\n/)){const h=/^([A-ZÄÖÜ]{1,3}):\s*(?:#.*)?$/.exec(line);if(h){if(current?.title)out.push(current);current={code:h[1],title:'',state:''};continue}if(!current)continue;const f=/^  (title|state):\s*(.*?)\s*$/.exec(line);if(f){let v=f[2].replace(/\s+#.*$/,'');if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1).replace(/''/g,"'");current[f[1]]=v}}if(current?.title)out.push(current);if(out.length<400)throw Error('Datensatz unvollständig');return out.sort((a,b)=>a.code.localeCompare(b.code,'de'))}
function notice(text,bad=false){ui.status.textContent=text;ui.status.classList.toggle('bad',bad)}function remember(code){recent=[code,...recent.filter(x=>x!==code)].slice(0,8);save(RECENT_KEY,JSON.stringify(recent))}function setQuery(value){query=value;selected='';render();ui.results.scrollTop=0}function card(item){const b=document.createElement('button');b.type='button';b.className='row'+(selected===item.code?' selected':'');const p=document.createElement('span');p.className='plate';p.textContent=item.code;const info=document.createElement('span');info.className='info';const place=document.createElement('span');place.className='place';place.textContent=item.title;const region=document.createElement('span');region.className='region';region.textContent=item.state||'Deutschland';info.append(place,region);b.append(p,info);b.addEventListener('click',()=>{query=item.code;selected=item.code;remember(item.code);render();ui.results.scrollTop=0});return b}
function render(){ui.query.textContent=query||'–';ui.back.disabled=ui.clear.disabled=!query;ui.results.replaceChildren();const matches=query?records.filter(x=>x.code.startsWith(query)):recent.map(x=>records.find(r=>r.code===x)).filter(Boolean);ui.label.textContent=query?`${matches.length} Treffer für „${query}“`:'Zuletzt angesehen';if(!matches.length){const msg=document.createElement('p');msg.className='empty';msg.textContent=!records.length?'Zum ersten Laden ist Internet erforderlich.':'Tippe den ersten Buchstaben an oder beginne mit × eine neue Suche.';ui.results.append(msg)}else{if(query){const exact=matches.find(x=>x.code===query);if(exact)ui.results.append(card(exact))}for(const item of matches)if(!query||item.code!==query)ui.results.append(card(item))}for(const b of ui.keys.children)b.disabled=!records.length||query.length>=3}
for(const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'){const b=document.createElement('button');b.type='button';b.className='key';b.textContent=ch;b.setAttribute('aria-label','Buchstabe '+ch);b.addEventListener('click',()=>{if(query.length<3)setQuery(query+ch)});ui.keys.append(b)}ui.back.addEventListener('click',()=>setQuery(query.slice(0,-1)));ui.clear.addEventListener('click',()=>setQuery(''));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target instanceof HTMLButtonElement)return;const ch=e.key.toUpperCase();if(/^[A-ZÄÖÜ]$/.test(ch)&&query.length<3)setQuery(query+ch);else if(e.key==='Backspace'){e.preventDefault();setQuery(query.slice(0,-1))}else if(e.key==='Escape')setQuery('')});
async function load(){const old=read(DATA_KEY);if(old)try{records=parse(old);notice(`${records.length} Kürzel · lokal gespeichert · prüfe Aktualisierung`);render()}catch{}try{const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),10000);let response;try{response=await fetch(SOURCE,{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const text=await response.text(),fresh=parse(text);records=fresh;save(DATA_KEY,text);notice(`${records.length} Kürzel · nach dem ersten Laden auch offline verfügbar`);render()}catch{notice(records.length?`${records.length} Kürzel · gespeicherte Liste (offline)`:'Liste nicht verfügbar. Internet prüfen und neu laden.',!records.length);render()}}render();load();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
