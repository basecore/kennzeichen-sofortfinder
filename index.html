<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142b47">
  <meta name="description" content="Kfz-Kennzeichen in Europa mit vollständiger lokaler Kürzelliste für Deutschland nachschlagen.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Kennzeichen-Sofortfinder Europa</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1b2e48;
      background: #e8eff7;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid #f2a12e;
      outline-offset: 2px;
    }

    .app {
      height: 100dvh;
      min-height: 490px;
      max-width: 680px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #f7f9fc;
      box-shadow: 0 0 30px #152d4933;
    }

    .head {
      background: #142b47;
      color: white;
      padding: calc(10px + env(safe-area-inset-top)) 13px 10px;
    }

    .headtop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin: 0;
    }

    .brand img {
      width: 37px;
      height: 37px;
      border-radius: 9px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
    }

    .brand small {
      color: #c8d9ee;
      font-size: .72rem;
    }

    .wake-button {
      flex: none;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid #7894b1;
      border-radius: 10px;
      background: #dceafe;
      color: #183a61;
      font-size: .76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .wake-button[aria-pressed="true"] {
      background: #f2a12e;
      border-color: #f2a12e;
      color: #142b47;
    }

    /* Erfolgsstatus nur für Screenreader: keine Layout-Verschiebung */
    .wake-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Tatsächliche Fehler bleiben sichtbar */
    .wake-status.warn {
      position: static;
      width: auto;
      height: auto;
      margin: 0 0 7px;
      overflow: visible;
      clip-path: none;
      white-space: normal;
      color: #ffd166;
      font-size: .76rem;
    }

    .wake-video {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 2px;
      height: 2px;
      opacity: .04;
      pointer-events: none;
    }

    .country {
      width: 100%;
      height: 45px;
      margin-bottom: 8px;
      padding: 0 10px;
      border: 1px solid #7894b1;
      border-radius: 10px;
      background: white;
      color: #173454;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .entry {
      display: flex;
      gap: 7px;
      align-items: stretch;
    }

    .plate {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 60px;
      overflow: hidden;
      border: 2px solid #d9e1eb;
      border-radius: 9px;
      background: white;
      color: #172d48;
    }

    .band {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      background: #164b9b;
      color: white;
      line-height: 1.1;
    }

    .eu-mark {
      width: 28px;
      height: 28px;
    }

    .countrycode {
      font-size: .83rem;
      font-weight: 850;
    }

    .letters {
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 1.68rem;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .action {
      min-width: 48px;
      border: 0;
      border-radius: 9px;
      background: #dceafe;
      color: #183a61;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .action:disabled { opacity: .5; }

    .note {
      margin: 7px 1px 0;
      color: #dce9f7;
      font-size: .78rem;
      line-height: 1.3;
    }

    .status {
      padding: 8px 13px;
      background: #e8f0fa;
      color: #285071;
      font-size: .79rem;
    }

    .status.warn {
      background: #fff0d6;
      color: #684819;
    }

    .label {
      margin: 0;
      padding: 9px 13px 6px;
      color: #536680;
      font-size: .83rem;
      font-weight: 700;
    }

    .results {
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 0 10px 7px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 72px;
      margin-bottom: 7px;
      padding: 10px;
      border: 1px solid #d9e3ef;
      border-radius: 11px;
      background: white;
      color: inherit;
      text-align: left;
      text-decoration: none;
    }

    .row:active {
      border-color: #5c91cc;
      background: #e0efff;
    }

    .code {
      min-width: 63px;
      padding: 8px 5px;
      border-left: 7px solid #1769aa;
      border-radius: 5px;
      background: #f4f8ff;
      text-align: center;
      font-size: 1.22rem;
      font-weight: 850;
    }

    .names {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .names strong {
      overflow-wrap: anywhere;
      font-size: 1.2rem;
      line-height: 1.15;
    }

    .names small {
      color: #5d7188;
      font-size: .79rem;
    }

    .arrow {
      color: #4674a3;
      font-size: 1.3rem;
    }

    .empty {
      padding: 14px 5px;
      color: #526782;
      line-height: 1.5;
    }

    .retry {
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      background: #164b9b;
      color: white;
      font-weight: 700;
    }

    .foot {
      padding: 8px 9px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid #d0dbe8;
      background: #e4edf6;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .key {
      min-height: 47px;
      border: 1px solid #acc1d7;
      border-radius: 9px;
      background: white;
      color: #193955;
      font-size: 1.14rem;
      font-weight: 800;
    }

    .key:disabled {
      border-color: #c1cad4;
      background: #d1d8e0;
      color: #8291a2;
      opacity: .75;
      cursor: not-allowed;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px;
      margin: 7px 2px 0;
      color: #53687f;
      font-size: .7rem;
    }

    @media (max-height: 650px) {
      .country { height: 38px; margin-bottom: 5px; }
      .plate { min-height: 50px; }
      .row { min-height: 62px; }
      .key { min-height: 39px; }
      .head { padding-top: calc(5px + env(safe-area-inset-top)); }
    }
  </style>

  <script src="./app.js?v=2.2.1" defer></script>
</head>

<body>
  <main class="app">
    <header class="head">
      <div class="headtop">
        <div class="brand">
          <img src="./icon.svg" alt="Kennzeichen-Logo">
          <div>
            <h1>Kennzeichen-Sofortfinder</h1>
            <small>Kürzel suchen · Orte finden</small>
          </div>
        </div>

        <button
          id="alwaysOnButton"
          class="wake-button"
          type="button"
          aria-pressed="false"
          aria-describedby="alwaysOnStatus"
        >☀ Display anlassen</button>
      </div>

      <p id="alwaysOnStatus" class="wake-status" role="status" aria-live="polite"></p>

      <select id="country" class="country" aria-label="Land auswählen"></select>

      <div class="entry">
        <div class="plate" aria-label="Gewähltes Land und Kürzel">
          <span class="band">
            <svg
              id="euMark"
              class="eu-mark"
              viewBox="0 0 40 40"
              role="img"
              aria-label="EU-Sternkreis"
            ></svg>
            <span id="countrycode" class="countrycode"></span>
          </span>
          <span id="query" class="letters">–</span>
        </div>

        <button id="back" class="action" aria-label="Letzten Buchstaben löschen">⌫</button>
        <button id="clear" class="action" aria-label="Neue Suche">×</button>
      </div>

      <p id="note" class="note">Unten ein Kürzel antippen, um den Ort bei Wikipedia zu öffnen.</p>
    </header>

    <div id="status" class="status" role="status">Lade vollständige Ortsliste …</div>

    <p id="label" class="label">Kennzeichen</p>

    <section id="results" class="results" aria-label="Anklickbare Kennzeichen-Treffer"></section>

    <footer class="foot">
      <div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div>

      <div class="meta">
        <span>v2.3.1 · 01.10.2026</span>
        <a href="./research.html">Europa-Daten (Recherche) ↗</a>
        <a
          href="https://github.com/basecore/kennzeichen-sofortfinder"
          target="_blank"
          rel="noopener noreferrer"
        >GitHub ↗</a>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const button = document.getElementById('alwaysOnButton');
      const status = document.getElementById('alwaysOnStatus');
      const header = button.parentElement;

      let enabled = false;
      let wakeLock = null;
      let video = null;
      let serial = 0;

      const videoSource =
        'data:video/mp4;base64,AAAAJGZ0eXBpc29tAAACAGlzb21pc282aXNvMmF2YzFtcDQxAAAC7G1vb3YAAABsbXZoZAAAAAAAAAAAAAAAAAAAA+gAAAAAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAHvdHJhawAAAFx0a2hkAAAAAwAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAQAAAAEAAAAAABi21kaWEAAAAgbWRoZAAAAAAAAAAAAAAAAAAAQAAAAAAAVcQAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAATZtaW5mAAAAFHZtaGQAAAABAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAD2c3RibAAAAKpzdHNkAAAAAAAAAAEAAACaYXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAQABAASAAAAEgAAAAAAAAAARVMYXZjNjIuMTEuMTAwIGxpYngyNjQAAAAAAAAAAAAAABj//wAAADRhdmNDAWQACv/hABdnZAAKrNlewEQAAAMABAAAAwAIPEiWWAEABmjr48siwP34+AAAAAAQcGFzcAAAAAEAAAABAAAAEHN0dHMAAAAAAAAAAAAAABBzdHNjAAAAAAAAAAAAAAAUc3RzegAAAAAAAAAAAAAAAAAAABBzdGNvAAAAAAAAAAAAAAAobXZleAAAACB0cmV4AAAAAAAAAAEAAAABAAAAAAAAAAAAAAAAAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2Mi4zLjEwMAAAAHhtb29mAAAAEG1maGQAAAAAAAAAAQAAAGB0cmFmAAAAJHRmaGQAAAA5AAAAAQAAAAAAAAMQAABAAAAAArcBAQAAAAAAFHRmZHQBAAAAAAAAAAAAAAAAAAAgdHJ1bgAAAgUAAAACAAAAgAIAAAAAAAK3AAAADAAAAsttZGF0AAACnwYF//+b3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjUgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0xIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgbnI9MCBkZWNpbWF0ZT0xIGludGVybGFjZWQ9MCBibHVyYXlfY29tcGF0PTAgYl9yYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTIga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAKAAAAAQZYiEABb//vfTP8yy75olkQAAAAhBmiFsQV/+8AAA AENtZnJhAAAAK3RmcmEBAAAAAAAAAQAAAAAAAAABAAAAAAAAAAAAAAAAAAADERABAQEAAAAQbWZybwAAAAAAAABD';

      function setStatus(message, isWarning = false) {
        status.textContent = message;
        status.classList.toggle('warn', isWarning);
      }

      function stopVideo() {
        if (!video) return;
        video.pause();
        video.remove();
        video = null;
      }

      async function stopAlwaysOn() {
        serial += 1;
        stopVideo();

        const previousLock = wakeLock;
        wakeLock = null;

        if (previousLock) {
          try {
            await previousLock.release();
          } catch (error) {
            console.warn('Wake Lock release:', error);
          }
        }

        setStatus('');
      }

      async function startAlwaysOn() {
        if (!enabled || document.visibilityState !== 'visible') return;

        const attempt = ++serial;

        if (wakeLock && !wakeLock.released) return;

        try {
          if (navigator.wakeLock?.request) {
            const grantedLock = await navigator.wakeLock.request('screen');

            if (!enabled || attempt !== serial) {
              await grantedLock.release();
              return;
            }

            wakeLock = grantedLock;

            grantedLock.addEventListener('release', () => {
              if (wakeLock !== grantedLock) return;

              wakeLock = null;

              if (enabled && document.visibilityState === 'visible') {
                setStatus('Displaysperre unterbrochen – Button erneut antippen.', true);
              }
            });

            stopVideo();
            setStatus('Display bleibt an (Wake Lock).');
            return;
          }
        } catch (error) {
          console.warn('Wake Lock:', error);
        }

        if (!enabled || attempt !== serial) return;

        try {
          if (!video) {
            video = document.createElement('video');
            video.className = 'wake-video';
            video.src = videoSource;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('aria-hidden', 'true');
            header.append(video);
          }

          await video.play();

          if (!enabled || attempt !== serial) {
            stopVideo();
            return;
          }

          setStatus('Video-Fallback aktiv – am Gerät prüfen.');
        } catch (error) {
          console.warn('Video-Fallback:', error);
          stopVideo();
          setStatus('Display-Anlassen auf diesem Gerät nicht verfügbar.', true);
        }
      }

      button.addEventListener('click', () => {
        enabled = !enabled;

        button.setAttribute('aria-pressed', String(enabled));
        button.textContent = '☀ Display anlassen';

        if (enabled) {
          void startAlwaysOn();
        } else {
          void stopAlwaysOn();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (enabled && document.visibilityState === 'visible') {
          void startAlwaysOn();
        }
      });
    })();
  </script>
</body>
</html>
