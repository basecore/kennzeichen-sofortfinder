<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b47"><meta name="description" content="Kfz-Kennzeichen in Europa mit vollständiger lokaler Kürzelliste für Deutschland nachschlagen."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder Europa</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2e48;background:#e8eff7}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f2a12e;outline-offset:2px}.app{height:100dvh;min-height:490px;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#f7f9fc;box-shadow:0 0 30px #152d4933}.head{background:#142b47;color:white;padding:calc(10px + env(safe-area-inset-top)) 13px 10px}.brand{display:flex;align-items:center;gap:8px;margin-bottom:9px}.brand img{width:37px;height:37px;border-radius:9px}.brand h1{font-size:1.08rem;margin:0}.brand small{font-size:.72rem;color:#c8d9ee}.country{width:100%;height:45px;border-radius:10px;border:1px solid #7894b1;background:white;color:#173454;font-size:1.02rem;font-weight:700;padding:0 10px;margin-bottom:8px}.entry{display:flex;gap:7px;align-items:center}.flag{font-size:1.55rem}.entry input{flex:1;min-width:0;height:43px;border:1px solid #7894b1;border-radius:10px;padding:0 10px;font-size:1.3rem;letter-spacing:.1em;text-transform:uppercase}.entry button{height:43px;border:0;border-radius:10px;background:#f2a12e;color:#142b47;font-weight:800;padding:0 14px}.note{font-size:.78rem;margin:7px 0 0;color:#d1e0f1}.status{margin-top:12px;color:#d1d5db}.wake-control{display:flex;align-items:center;gap:7px;margin:5px 0;color:#d9e6f4;font-size:.86rem}.wake-status{min-height:1.1em;margin:0;color:#c8d9ee;font-size:.78rem}.wake-status.warn{color:#ffd166}.actions{display:flex;gap:8px;margin-top:12px}.actions button{font:inherit;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.actions button:disabled{opacity:.4;cursor:not-allowed}.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}.key{font:inherit;padding:10px 0;border:1px solid #374151;background:#1f2937;color:#f9fafb;border-radius:8px}.key:disabled{opacity:.3}.results{display:grid;gap:8px;margin-top:14px;max-height:52vh;overflow:auto}.row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;background:#1f2937;color:inherit;text-decoration:none}.code{min-width:44px;font-weight:800;color:#facc15}.names{display:grid;gap:2px;flex:1}.names small{color:#9ca3af}.arrow{color:#93c5fd}.empty{color:#9ca3af}.retry{font:inherit;padding:10px;border:1px solid #4b5563;border-radius:10px;background:#1f2937;color:#fff}.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;color:#9ca3af;font-size:.85rem}.foot a{color:#93c5fd}@media(max-width:520px){.keys{grid-template-columns:repeat(7,1fr)}.head{align-items:flex-start}.head h1{font-size:1.05rem}}</style><script src="./app.js?v=2.3.4" defer></script></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt=""><h1>Kennzeichen-Sofortfinder</h1></div><a href="./research.html">Recherche ↗</a></header><select id="country" class="country" aria-label="Land auswählen"></select><div class="plate" aria-label="aktuelles Suchkürzel"><span id="euMark" class="blue">EU</span><span id="countrycode" class="blue">D</span><span id="query" class="query">–</span><span class="hint">Kennzeichenkürzel</span></div><p id="note" class="note">Unten ein Kürzel antippen, um den Ort bei Wikipedia zu öffnen.</p></header><div id="status" class="status" role="status">Lade vollständige Ortsliste …</div><label class="wake-control"><input id="keepAwake" type="checkbox"> Display anlassen</label><p id="wakeStatus" class="wake-status" aria-live="polite"></p><p id="label" class="label">Kennzeichen</p><section id="results" class="results" aria-label="Anklickbare Kennzeichen-Treffer"></section><footer class="foot"><div id="keys" class="keys" aria-label="ABC-Tastenfeld"></div><div class="meta"><span>v2.3.4 · 01.10.2026</span><a href="./research.html">Europa-Daten (Recherche) ↗</a><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></footer></main></body></html>
