<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Kfz-Kennzeichen in Deutschland, Österreich und Europa mit vollständiger lokaler Kürzelliste für Deutschland nachschlagen."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Kennzeichen-Sofortfinder</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:16px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px}.head h1{font-size:1.25rem;margin:0}.country{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#f9fafb;margin-top:16px}.plate{display:flex;align-items:center;gap:10px;margin-top:14px}.blue{background:#2563eb;color:#fff;border-radius:8px;padding:3px 8px;font-weight:800}.query{font:2rem ui-monospace,monospace;letter-spacing:.16em}.hint{color:#9ca3af}.status{margin-top:12px;color:#d1d5db}.wake-control{display:flex;gap:8px;align-items:center;margin-top:10px;color:#9ca3af;font-size:.9rem}.wake-status{min-height:1.2em;margin:4px 0;color:#9ca3af;font-size:.82rem}.wake-status.warn{color:#fbbf24}.actions{display:flex;gap:8px;margin-top:12px}.actions button{font:inherit;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.actions button:disabled{opacity:.4;cursor:not-allowed}.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}.key{font:inherit;padding:10px 0;border:1px solid #374151;background:#1f2937;color:#f9fafb;border-radius:8px}.key:disabled{opacity:.3}.results{display:grid;gap:8px;margin-top:14px;max-height:52vh;overflow:auto}.row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:10px;background:#1f2937;color:inherit;text-decoration:none}.code{min-width:44px;font-weight:800;color:#facc15}.names{display:grid;gap:2px;flex:1}.names small{color:#9ca3af}.arrow{color:#93c5fd}.empty{color:#9ca3af}.retry{font:inherit;padding:10px;border:1px solid #4b5563;border-radius:10px;background:#1f2937;color:#fff}.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;color:#9ca3af;font-size:.85rem}.foot a{color:#93c5fd}@media(max-width:520px){.keys{grid-template-columns:repeat(7,1fr)}.head{align-items:flex-start}.head h1{font-size:1.05rem}}</style><script src="./app.js?v=2.3.3" defer></script></head><body><main class="app"><header class="head"><div class="brand"><img src="./icon.svg" alt=""><h1>Kennzeichen-Sofortfinder</h1></div><a href="./research.html">Recherche ↗</a></header><select id="country" class="country" aria-label="Land auswählen"></select><div class="plate" aria-label="aktuelles Suchkürzel"><span id="euMark" class="blue" aria-hidden="true">EU</span><span id="countrycode" class="blue">D</span><span id="query" class="query">–</span><span class="hint">Kennzeichenkürzel</span></div><p id="note" class="note">Unten ein Kürzel antippen, um den Ort bei Wikipedia zu öffnen.</p></header><div id="status" class="status" role="status">Lade vollständige Ortsliste …</div><label class="wake-control"><input id="keepAwake" type="checkbox"> Display anlassen</label><p id="wakeStatus" class="wake-status" aria-live="polite"></p><p id="label" class="label">Kennzeichen</p><section id="results" class="results" aria-label="Anklickbare Ortsliste"></section><footer class="foot"><span>v2.3.0 · 30.09.2026</span><a href="./research.html">Europa-Daten (Recherche) ↗</a><a href="https://github.com/basecore/kennzeichen-sofortfinder" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer></main></body></html>
